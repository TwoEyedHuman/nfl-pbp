# fly.toml app configuration file generated for nfl-win-probability on 2026-05-28T20:07:05-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nfl-win-probability'
primary_region = 'iad'

[build]

[env]
  CACHE_DIR = '/app/cache'

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '90s'
    interval = '30s'
    method = 'GET'
    path = '/_stcore/health'
    timeout = '10s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
